<!DOCTYPE html>
<html>
    <head>
        <title>Hypixel Sheep Stats</title>
        <meta name="description" content="Hypixel Sheep Stats and Leaderboards"/>
	    <link rel="preconnect" href="https://fonts.googleapis.com">
	    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&display=swap" rel="stylesheet"> 
        <link rel="stylesheet" href="css.css">
      <script type="module" src="global.js"></script>
	    <script>
            function checkEnter(event) {
      if (event.key === "Enter") {
        const username = document.getElementById("username").value;
        window.location.href = "stats.html?username=" + username;
      }
    }
        </script>
        <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
		<script defer src="/_vercel/insights/script.js"></script>
    </head>
    <body>
	    <div id="navbar"></div>
      <div id="page">
        <div id="sheepcontainer">
          <text class="title">sheep stats</text>
          <div class="break"></div>
          <input type="text" id="username" class="bytefield" placeholder="Username" onkeydown="checkEnter(event)">
          <div class="break"></div>
          <a class="bytebtn" href="leaderboards.html?type=total&page=1">Leaderboards</a>
        </div>
      </div>
    </body>
</html>
